<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main>
        <h1>Consulta CEP</h1>
        <form id="formulario">
            <label for="cep">CEP</label>
            <input type="text" id="cep" inputmode="numeric" placeholder="010001-000" maxlength="9" required>
            <button id="botao" type="submit">Buscar endereço</button>
            <p id="mensagem" role="status"></p>
            <section aria-label="Endereco endereço">
                <label for="rua">Rua</label>
                <input type="text" id="rua" readonly>

                <label for="bairro">Bairro</label>
                <input type="text" id="bairro" readonly>

                <label for="cidade">Cidade</label>
                <input type="text" id="cidade" readonly>

                <label for="estado">Estado (UF)</label>
                <input type="text" id="estado" readonly>
            </section>

            <small>O CEP não informa o nome do morador nem o número da casa.</small>
        </form>
    </main>

</body>

</html>
